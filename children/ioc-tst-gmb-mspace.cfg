RELEASE=$$UP(PATH)
ENGINEER=Jane Liu (janeliu-slac)
LOCATION=B750 Maker Space
IOC_PV=TST:IOC:GMB
ARCH=rhel9-x86_64

# GMB(BASE=PVBASE,PORT=IPPORT,HOST=IPADDR,TYPE=TCP|RTU|ASCII)
# Port defaults to 502. RTO (read timeout) defaults to 5000ms,
# WTO (write timeout) defaults to 0ms.
GMB(BASE=TST:GMB:01,HOST=192.168.1.1)
GMB(BASE=TST:GMB:02,HOST=192.168.1.2,WTO=1000)

# Default SLAVE=0, TYPE=0, POLL=5000 (ms). 
# FUNC is the modbus function, ADDR/LEN is the memory map.
REGION(NAME=test,FUNC=3,ADDR=0x1000,LEN=125)
REGION(NAME=read,FUNC=3,ADDR=0x2000,LEN=125,TYPE=4,POLL=1000)
